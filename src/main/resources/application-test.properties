# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS DE PRUEBAS (H2 in-memory)
# ==========================================
spring.datasource.url=jdbc:h2:mem:designaciones_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# URL base simulada para prod en tests
app.datasource.prod.url=jdbc:h2:mem:designaciones_prod;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
app.datasource.prod.username=sa
app.datasource.prod.password=

# Context / Config
server.port=8081
logging.level.com.designaciones.webdesignaciones=INFO

# Seguridad y JWT
JWT_SECRET=testSecretKeyForWebDesignacionesTestsOnly1234567890
JWT_PHONE=1199998888
JWT_GENERATOR=webdesignaciones-test
CORS_ORIGINS=http://localhost:3000

# Configuración Global de Zona Horaria Argentina
app.timezone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
