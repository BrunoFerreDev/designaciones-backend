spring.application.name=webdesignaciones
# ==========================================
# CONFIGURACIÓN DEL DATASOURCE (SQLite)
# ==========================================
#spring.datasource.url=jdbc:sqlite:mibasededatos.sqlite
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.port=8081
# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
# Dialecto nativo de SQLite para Hibernate 6 (Spring Boot 3+)
#spring.jpa.database-platform=org.hibernate.community.dialect.PostgreSQLLegacyDialect
#spring.datasource.driver-class-name=org.postgresql.JDBC
spring.jpa.hibernate.ddl-auto=update
# Mostrar las consultas SQL en la consola (opcional, muy útil para debuggear)
spring.jpa.properties.hibernate.format_sql=true
# ==========================================
# CONFIGURACIÓN DE CORS
# ==========================================
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.exposed-headers=Authorization,Content-Type
cors.allow-credentials=true
cors.max-age=3600
# Si tienes un context-path global:
#server.servlet.context-path=/api
security.jwt.private.user.phone=${USER_PHONE}
security.jwt.private.user.generator=${USER_GENERATOR}
security.jwt.private.key=${PRIVATE_KEY}
#SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Base de datos de producción/principal para sincronización
app.datasource.prod.url=jdbc:postgresql://localhost:5432/designaciones
app.datasource.prod.username=develop
app.datasource.prod.password=develop123

spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000