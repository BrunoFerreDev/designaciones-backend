spring.application.name=webdesignaciones
server.port=${PORT}
# ==========================================
# BASE DE DATOS (Supabase / Postgres)
# Env vars simples: DB_URL, DB_USER, DB_PASS
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# HikariCP Pool Config
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# ==========================================
# ZONA HORARIA Y SERIALIZACIÓN
# ==========================================
app.timezone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
# ==========================================
# CORS (Env var: CORS_ORIGINS)
# ==========================================
cors.allowed-origins=${CORS_ORIGINS}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.exposed-headers=Authorization,Content-Type
cors.allow-credentials=true
cors.max-age=3600
# ==========================================
# SEGURIDAD Y JWT (Env vars: JWT_SECRET, JWT_PHONE, JWT_GENERATOR)
# ==========================================
security.jwt.private.user.phone=${JWT_PHONE}
security.jwt.private.user.generator=${JWT_GENERATOR}
security.jwt.private.key=${JWT_SECRET}
# ==========================================
# SWAGGER & LOGGING
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.org.springdoc=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO