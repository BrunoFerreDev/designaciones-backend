<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Designaciones Históricas - ArbDesig</title>
    <!-- Tailwind CSS v4 Browser/Play CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Font and icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabler-icons@latest/iconfont/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Layout script -->
    <script type="module" src="../js/layout.js"></script>
    <link rel="icon" type="image/png" href="../arbitro.png" />
  </head>
  <body class="hidden">
    <div class="content flex-1">
      <!-- Topbar Header -->
      <div
        class="topbar flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4 sticky top-0 z-10"
      >
        <div>
          <div class="topbar-title text-lg font-bold text-slate-800">
            Registrar Designaciones Históricas
          </div>
          <div class="topbar-sub text-xs text-slate-500 mt-1">
            Registra partidos de fechas pasadas y asigna sus árbitros
          </div>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="p-6">
        <!-- Step 1: Select Date -->
        <div
          class="card bg-white rounded-2xl border border-slate-150 p-5 mb-6 shadow-sm max-w-xl"
        >
          <div class="flex flex-col">
            <label
              for="history-fecha"
              class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1"
              >1. Seleccionar Fecha de los Partidos</label
            >
            <input
              type="date"
              id="history-fecha"
              class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-3 text-sm focus:border-emerald-500 focus:bg-white outline-none w-full md:w-64"
            />
          </div>
        </div>

        <!-- Step 2: Canchas selection & configuration -->
        <div
          id="step2-card"
          class="hidden card bg-white rounded-2xl border border-slate-150 p-6 shadow-sm mb-6 animate-fade-in"
        >
          <div
            class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4 flex-wrap gap-2"
          >
            <div class="flex items-center gap-2">
              <span
                class="text-xs font-bold text-slate-500 uppercase tracking-wider"
                >2. Canchas Designadas</span
              >
              <span class="text-[10px] text-slate-400 font-medium"
                >(Selecciona y configura cada una)</span
              >
            </div>
            <div class="flex gap-2 text-xs">
              <button
                type="button"
                id="btn-select-all-canchas"
                class="text-emerald-600 hover:text-emerald-700 font-semibold underline cursor-pointer bg-transparent border-0 p-0"
              >
                Seleccionar todas
              </button>
              <span class="text-slate-200">|</span>
              <button
                type="button"
                id="btn-clear-canchas"
                class="text-rose-600 hover:text-rose-700 font-semibold underline cursor-pointer bg-transparent border-0 p-0"
              >
                Limpiar selección
              </button>
            </div>
          </div>

          <!-- Canchas configuration checklist grid -->
          <div
            id="canchas-configs-grid"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"
          ></div>

          <div class="flex justify-end pt-4 border-t border-slate-100">
            <button
              type="button"
              id="btn-register-historical"
              class="btn primary px-6 h-10 text-xs font-bold flex items-center gap-1.5 shadow-md disabled:opacity-40 cursor-pointer"
              disabled
            >
              <span>Registrar (<span id="count-selected-historical">0</span>) Designaciones</span>
              <i class="ti ti-check"></i>
            </button>
          </div>
        </div>

        <!-- Existing Designations List for selected Date -->
        <div id="existing-list-section" class="hidden flex flex-col gap-4 mt-8 animate-fade-in">
          <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <div class="flex items-center gap-2">
              <i class="ti ti-calendar text-emerald-600 text-lg"></i>
              <span class="text-sm font-bold text-slate-800">
                Designaciones registradas para el <span id="label-selected-date" class="text-emerald-700"></span>
              </span>
            </div>
            <div class="flex gap-2">
              <button type="button" id="btn-history-summary" class="btn border-blue-500 text-blue-600 hover:bg-blue-50 transition text-xs flex items-center gap-1.5 cursor-pointer">
                <i class="ti ti-calendar-event"></i>
                <span>Ver por día</span>
              </button>
              <button type="button" id="btn-history-refresh" class="btn border-slate-200 text-slate-600 hover:bg-slate-50 transition text-xs flex items-center gap-1.5 cursor-pointer">
                <i class="ti ti-refresh"></i>
                <span>Refrescar</span>
              </button>
            </div>
          </div>

          <div id="list-loading" class="hidden text-center py-10 text-slate-400 text-xs">
            <i class="ti ti-loader spin-icon text-2xl text-emerald-600 block mb-2 mx-auto"></i>
            <span>Cargando partidos registrados...</span>
          </div>

          <div id="list-empty" class="hidden text-center py-10 text-slate-400 text-xs border border-dashed rounded-2xl bg-slate-50">
            No hay designaciones registradas en esta fecha.
          </div>

          <div id="history-results-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
      </div>
    </div>

    <!-- Modals are loaded dynamically via modular components -->
    <script type="module" src="../js/views/designaciones-viejas.js"></script>
  </body>
</html>
