<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de Designaciones - ArbDesig</title>
    <!-- Tailwind CSS v4 Browser/Play CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Font and icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabler-icons@latest/iconfont/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/layout.js"></script>
    <link rel="icon" type="image/png" href="../arbitro.png" />
  </head>
  <body class="hidden">
    <div class="content flex-1">
      <!-- Topbar Header -->
      <div
        class="topbar flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4 sticky top-0 z-10"
      >
        <div>
          <div class="topbar-title text-lg font-bold text-slate-800">
            Buscador de Designaciones
          </div>
          <div class="topbar-sub text-xs text-slate-500 mt-1">
            Encuentra y gestiona designaciones por fecha, rango, árbitro o cancha
          </div>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="p-6">
        <!-- Search Mode Segmented Tabs -->
        <div
          class="bg-slate-100/80 p-1.5 rounded-2xl flex gap-1 border border-slate-200/40 mb-6 flex-wrap md:flex-nowrap"
        >
          <button
            id="tab-single"
            class="search-tab-btn flex-1 py-2 px-3 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-all rounded-xl flex items-center justify-center gap-1.5 active cursor-pointer"
            data-mode="single"
          >
            <i class="ti ti-calendar text-sm"></i>
            <span>Fecha Única</span>
          </button>
          <button
            id="tab-range"
            class="search-tab-btn flex-1 py-2 px-3 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-all rounded-xl flex items-center justify-center gap-1.5 cursor-pointer"
            data-mode="range"
          >
            <i class="ti ti-calendar-event text-sm"></i>
            <span>Rango de Fechas</span>
          </button>
          <button
            id="tab-monthly"
            class="search-tab-btn flex-1 py-2 px-3 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-all rounded-xl flex items-center justify-center gap-1.5 cursor-pointer"
            data-mode="monthly"
          >
            <i class="ti ti-calendar-stats text-sm"></i>
            <span>Por Mes</span>
          </button>
          <button
            id="tab-referee"
            class="search-tab-btn flex-1 py-2 px-3 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-all rounded-xl flex items-center justify-center gap-1.5 cursor-pointer"
            data-mode="referee"
          >
            <i class="ti ti-user text-sm"></i>
            <span>Por Árbitro</span>
          </button>
          <button
            id="tab-court"
            class="search-tab-btn flex-1 py-2 px-3 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-all rounded-xl flex items-center justify-center gap-1.5 cursor-pointer"
            data-mode="court"
          >
            <i class="ti ti-map-pin text-sm"></i>
            <span>Por Cancha</span>
          </button>
          <button
            id="tab-status"
            class="search-tab-btn flex-1 py-2 px-3 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-all rounded-xl flex items-center justify-center gap-1.5 cursor-pointer"
            data-mode="status"
          >
            <i class="ti ti-activity text-sm"></i>
            <span>Por Estado</span>
          </button>
        </div>

        <!-- Filters Form Card -->
        <div
          class="card bg-white rounded-2xl border border-slate-150 p-6 shadow-sm max-w-3xl mb-6"
        >
          <form id="search-form" class="flex flex-col gap-4">
            <div id="filter-fields-wrapper">
              <!-- Mode 1: Single Date -->
              <div id="filter-single" class="filter-panel flex flex-col gap-1.5">
                <label for="search-fecha-single" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Fecha</label>
                <input type="date" id="search-fecha-single" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-3 text-sm focus:border-emerald-500 focus:bg-white outline-none" />
              </div>

              <!-- Mode 2: Range -->
              <div id="filter-range" class="filter-panel hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                  <label for="search-fecha-inicio" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Desde</label>
                  <input type="date" id="search-fecha-inicio" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-3 text-sm focus:border-emerald-500 focus:bg-white outline-none" />
                </div>
                <div class="flex flex-col gap-1.5">
                  <label for="search-fecha-fin" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Hasta</label>
                  <input type="date" id="search-fecha-fin" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-3 text-sm focus:border-emerald-500 focus:bg-white outline-none" />
                </div>
              </div>

              <!-- Mode 3: Monthly -->
              <div id="filter-monthly" class="filter-panel hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                  <label for="search-month" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Mes</label>
                  <select id="search-month" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-2 text-sm focus:border-emerald-500 focus:bg-white outline-none">
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3">Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                  </select>
                </div>
                <div class="flex flex-col gap-1.5">
                  <label for="search-year" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Año</label>
                  <select id="search-year" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-2 text-sm focus:border-emerald-500 focus:bg-white outline-none"></select>
                </div>
              </div>

              <!-- Mode 4: Referee -->
              <div id="filter-referee" class="filter-panel hidden flex flex-col gap-1.5">
                <label for="search-referee-select" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Árbitro</label>
                <select id="search-referee-select" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-2 text-sm focus:border-emerald-500 focus:bg-white outline-none">
                  <option value="" disabled selected>Seleccione un árbitro...</option>
                </select>
              </div>

              <!-- Mode 5: Court -->
              <div id="filter-court" class="filter-panel hidden flex flex-col gap-1.5">
                <label for="search-court-select" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Cancha</label>
                <select id="search-court-select" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-2 text-sm focus:border-emerald-500 focus:bg-white outline-none">
                  <option value="" disabled selected>Seleccione una cancha...</option>
                </select>
              </div>

              <!-- Mode 6: Status -->
              <div id="filter-status" class="filter-panel hidden flex flex-col gap-1.5">
                <label for="search-status-select" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Estado</label>
                <select id="search-status-select" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-2 text-sm focus:border-emerald-500 focus:bg-white outline-none">
                  <option value="INCOMPLETA">Incompleta (Faltan árbitros)</option>
                  <option value="COMPLETA">Completa (Terna lista)</option>
                  <option value="A_CONFIRMAR">Pendiente de Confirmar</option>
                  <option value="FINALIZADA">Finalizada</option>
                  <option value="CANCELADA">Cancelada / Suspendida</option>
                </select>
              </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button
                type="submit"
                id="btn-search-submit"
                class="btn primary px-6 h-10 text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow-md"
              >
                <i class="ti ti-search"></i>
                <span>Buscar Designaciones</span>
              </button>
            </div>
          </form>
        </div>

        <!-- Feedback Messages -->
        <div id="search-error" class="hidden alert bg-red-50 border border-red-200 text-red-800 text-xs font-semibold py-3 px-4 rounded-2xl mb-6">
          <i class="ti ti-alert-circle text-base"></i>
          <span id="search-error-text">Ocurrió un error.</span>
        </div>

        <div id="search-loading" class="hidden text-center py-16 text-slate-500">
          <i class="ti ti-loader spin-icon text-3xl text-emerald-600 block mb-2 mx-auto"></i>
          <p class="text-sm font-bold text-slate-700">Buscando designaciones...</p>
        </div>

        <div id="search-empty" class="hidden text-center py-16 text-slate-500">
          <div class="w-14 h-14 rounded-3xl bg-slate-100 text-slate-400 flex items-center justify-center text-2xl mx-auto mb-3">
            <i class="ti ti-clipboard-x"></i>
          </div>
          <p class="text-sm font-bold text-slate-700">No se encontraron resultados</p>
          <p class="text-xs text-slate-400 mt-0.5">Intenta con otros criterios o fechas</p>
        </div>

        <!-- Results Section -->
        <div id="search-results-section" class="hidden flex flex-col gap-6">
          <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <div class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <span>Resultados encontrados:</span>
              <span id="count-results" class="badge badge-green text-xs font-extrabold px-2.5 py-0.5 rounded-full">0</span>
            </div>
            <div class="flex gap-2">
              <button id="btn-search-summary" class="btn border-blue-500 text-blue-600 hover:bg-blue-50 transition text-xs flex items-center gap-1.5 cursor-pointer">
                <i class="ti ti-calendar-event"></i>
                <span>Ver por día</span>
              </button>
            </div>
          </div>

          <div id="search-results-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

          <!-- Pagination Container -->
          <div id="search-pagination" class="hidden flex items-center justify-between border-t border-slate-200 pt-4">
            <span id="pagination-info" class="text-xs text-slate-500 font-medium">Página 1 de 1</span>
            <div class="flex gap-2">
              <button id="btn-pagination-prev" class="btn px-3 py-1.5 text-xs font-bold cursor-pointer disabled:opacity-40" disabled>Anterior</button>
              <button id="btn-pagination-next" class="btn px-3 py-1.5 text-xs font-bold cursor-pointer disabled:opacity-40" disabled>Siguiente</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modals are loaded dynamically via modular components -->
    <script type="module" src="../js/views/buscar.js"></script>
  </body>
</html>
