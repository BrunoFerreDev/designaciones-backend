<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canchas - ArbDesig</title>
  <!-- Tailwind CSS v4 Browser/Play CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <!-- Font and icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://unpkg.com/tabler-icons@latest/iconfont/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Layout script -->
  <script type="module" src="js/layout.js"></script>
</head>
<body class="hidden">
  <div class="content flex-1">
    <!-- Topbar Header -->
    <div class="topbar flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4 sticky top-0 z-10">
      <div>
        <div class="topbar-title text-lg font-bold text-slate-800">Canchas</div>
        <div id="topbar-count" class="topbar-sub text-xs text-slate-500 mt-1">Cargando canchas...</div>
      </div>
      <button id="btn-new-court" class="btn primary flex items-center gap-1.5 px-4 py-2 border rounded-xl font-semibold text-sm transition">
        <i class="ti ti-plus text-base"></i>
        <span>Nueva cancha</span>
      </button>
    </div>

    <!-- Main Content Area -->
    <div class="p-6">
      <div id="empty-state" class="hidden text-center py-20 text-slate-500">
        <div class="empty-icon mb-4">
          <i class="ti ti-map-pin text-4xl text-slate-400"></i>
        </div>
        No hay canchas registradas
      </div>

      <div id="canchas-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Rendered statically via CanchaCard.js -->
      </div>
    </div>
  </div>

  <!-- Form Modal Overlay for Adding/Editing Court -->
  <div id="court-modal" class="modal-overlay hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden border border-slate-100 animate-slide-up">
      <div class="px-6 py-4 bg-slate-50 border-b border-slate-150 flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-slate-800 text-base">Nueva Cancha</h3>
        <button id="modal-close" class="p-1 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-200 cursor-pointer">
          <i class="ti ti-x text-lg"></i>
        </button>
      </div>
      <form id="court-form" class="p-6 flex flex-col gap-4">
        <input type="hidden" id="form-id">
        
        <div class="flex flex-col">
          <label for="form-nombre" class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Nombre de la cancha</label>
          <input type="text" id="form-nombre" required class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-3 text-sm focus:border-emerald-500 focus:bg-white outline-none">
        </div>

        <div class="flex flex-col">
          <label for="form-categoria" class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Categoría</label>
          <select id="form-categoria" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-2 text-sm focus:border-emerald-500 focus:bg-white outline-none">
            <option value="FUTBOL_11">Fútbol 11</option>
            <option value="FUTBOL_10">Fútbol 10</option>
            <option value="FUTBOL_9">Fútbol 9</option>
            <option value="FUTBOL_8">Fútbol 8</option>
            <option value="FUTBOL_7">Fútbol 7</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="form-ciudad" class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Ciudad (Ubicación)</label>
          <input type="text" id="form-ciudad" class="h-10 bg-slate-50 border border-slate-200 rounded-xl px-3 text-sm focus:border-emerald-500 focus:bg-white outline-none" placeholder="Ej: Rosario, Funes...">
        </div>

        <div class="flex flex-col gap-2.5 mt-2 bg-slate-50 p-4 rounded-2xl border border-slate-150">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Opciones de Cancha</label>
          <div class="flex items-center gap-6 mt-1 flex-wrap">
            <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 cursor-pointer">
              <input type="checkbox" id="form-fuera-de-juego" class="w-4 h-4 rounded accent-emerald-600">
              <span>Fuera de juego</span>
            </label>
            <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 cursor-pointer">
              <input type="checkbox" id="form-necesita-viaje" class="w-4 h-4 rounded accent-emerald-600">
              <span>Necesita Viaje (🚗)</span>
            </label>
            <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 cursor-pointer">
              <input type="checkbox" id="form-estado" class="w-4 h-4 rounded accent-emerald-600">
              <span>Activa</span>
            </label>
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-4 border-t border-slate-100 pt-4">
          <button type="button" id="form-cancel" class="px-5 py-2.5 border border-slate-200 rounded-xl font-semibold text-sm text-slate-500 hover:bg-slate-50 transition cursor-pointer">Cancelar</button>
          <button type="submit" id="form-submit" class="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-semibold text-sm shadow-md hover:bg-emerald-500 active:bg-emerald-700 transition cursor-pointer">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/views/canchas.js"></script>
</body>
</html>
